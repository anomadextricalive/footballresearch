<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crystal Palace FC - Investment Feasibility</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Space Mono', monospace;
      background-color: #f5f5f5;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    function CrystalPalaceFeasibility() {
      const ownership = [
        { name: "Woody Johnson", stake: "43%", note: "Acquired ex-Textor stake, Jul 2025, £190M" },
        { name: "Josh Harris", stake: "10%", note: "Cut from 18% to make room for Johnson" },
        { name: "David Blitzer", stake: "10%", note: "Cut from 18% to make room for Johnson" },
        { name: "Steve Parish", stake: "10%", note: "Chairman - retains football control" },
      ];

      const valuationRows = [
        { label: "Implied club value (Johnson deal)", value: "£400M+", detail: "from £190M / 43%, Jul 2025" },
        { label: "Forbes valuation", value: "£598M", detail: "$790M, May 2025, global rank #29" },
        { label: "Squad market value", value: "£475M", detail: "€550M, Transfermarkt, 25/26 squad" },
        { label: "Revenue (24/25)", value: "£221M", detail: "Forbes, FY2024-25" },
        { label: "Operating income", value: "£33M", detail: "pre player-trading EBITDA" },
      ];

      const trackRecord = [
        { season: "2025-26", tier: "PL", pos: "15th", pts: 45, w: 11, d: 12, l: 15, gd: "-10" },
        { season: "2024-25", tier: "PL", pos: "12th", pts: 53, w: 13, d: 14, l: 11, gd: "0" },
        { season: "2023-24", tier: "PL", pos: "10th", pts: 49, w: 13, d: 10, l: 15, gd: "-1" },
        { season: "2022-23", tier: "PL", pos: "11th", pts: 45, w: "-", d: "-", l: "-", gd: "-" },
      ];

      const riskLog = [
        { sev: "HIGH", title: "No control available", detail: "Every current owner is embedded, none is a forced or motivated seller. A minority stake buys economics, not decisions - Parish keeps football control regardless of stake size." },
        { sev: "MED", title: "Multi-club ownership rule exposure", detail: "The mechanism that forced Textor out (UEFA's 2+ club rule) is a standing constraint on any investor already holding stakes elsewhere in Europe." },
        { sev: "MED", title: "European income downgrade", detail: "Conference League prize pool is a fraction of Europa League's - the FA Cup win that should have been a revenue catalyst nets less than a mid-table PL finish would." },
        { sev: "LOW", title: "Relegation risk", detail: "15th with -10 GD is worth tracking, but 15 years of unbroken top-flight survival argues this is a bump, not a trend, so far." },
      ];

      const bidMultiples = [
        { label: "Bid size", value: "₹6,500 Cr", detail: "@ ₹1 = £0.007776 -> £505M" },
        { label: "Premium vs last transaction", value: "+26.4%", detail: "vs £400M implied, Johnson/Textor deal" },
        { label: "Discount vs Forbes ceiling", value: "-15.5%", detail: "vs £598M brand-value model" },
        { label: "P/S multiple", value: "2.29x", detail: "£505M / £221M revenue" },
        { label: "Ask/Squad multiple", value: "1.06x", detail: "£505M / £475M squad value" },
      ];

      return (
        <div className="min-h-screen bg-[#f5f5f5] p-4 md:p-8">
          <div className="max-w-7xl mx-auto space-y-8">

            {/* Header */}
            <div className="border-2 border-black bg-[#FFFF88] shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] p-6 md:p-8">
              <div className="mb-3 font-['Space_Mono',monospace] opacity-60 text-xs">
                CONFIDENTIAL_INVESTMENT_THESIS / JULY_2026_DESK_NOTE
              </div>
              <h1 className="font-['Space_Mono',monospace] font-bold text-2xl md:text-3xl mb-3">
                CRYSTAL_PALACE_FC_ACQUISITION
              </h1>
              <div className="font-['Space_Mono',monospace] text-sm md:text-base mb-4">
                SINGLE_ASSET_FEASIBILITY_&_BID_STRESS_TEST
              </div>
              <div className="flex gap-3 flex-wrap text-xs">
                <div className="border-2 border-black bg-white px-3 py-1 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">
                  <span className="font-['Space_Mono',monospace]">PREMIER_LEAGUE</span>
                </div>
                <div className="border-2 border-black bg-white px-3 py-1 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">
                  <span className="font-['Space_Mono',monospace]">NO_FULL_CLUB_SALE_ON_MARKET</span>
                </div>
                <div className="border-2 border-black bg-black text-white px-3 py-1 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">
                  <span className="font-['Space_Mono',monospace]">VERDICT: PASS</span>
                </div>
              </div>
            </div>

            {/* Executive Summary */}
            <div className="border-2 border-black bg-white shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
              <div className="border-b-2 border-black bg-black text-white px-4 md:px-6 py-3">
                <h2 className="font-['Space_Mono',monospace] font-bold text-sm md:text-base">
                  [ 01 ] EXECUTIVE_SUMMARY
                </h2>
              </div>
              <div className="p-4 md:p-6 space-y-3 font-['Space_Mono',monospace] text-xs md:text-sm leading-relaxed">
                <p>
                  <strong>Crystal Palace is not for sale.</strong> The last transaction was a stake transfer, not a takeover: in July 2025, Woody Johnson completed purchase of John Textor / Eagle Football's 43% shareholding for <strong>£190M</strong>, implying a whole-club value north of <strong>£400M</strong>. Steve Parish, Josh Harris, and David Blitzer stayed in as partners with no signal any intend to sell control.
                </p>
                <p>
                  The Textor exit was forced, not opportunistic - Eagle Football's dual ownership of Palace and Lyon breached UEFA's multi-club rule, costing Palace their Europa League spot (won via first-ever FA Cup) in favour of the Conference League. Selling the stake was the compliance fix, not a market signal.
                </p>
                <p className="pt-2 border-t border-gray-200 text-xs opacity-70">
                  Market Context: Ask/Squad healthy range 0.9-1.2x | Championship P/S median 2.5x | Only realistic entry today is a passive minority stake, not control
                </p>
              </div>
            </div>

            {/* Ownership */}
            <div className="border-2 border-black bg-white shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
              <div className="border-b-2 border-black bg-black text-white px-4 md:px-6 py-3">
                <h2 className="font-['Space_Mono',monospace] font-bold text-sm md:text-base">
                  [ 02 ] OWNERSHIP_STRUCTURE
                </h2>
              </div>
              <div className="p-4 md:p-6 space-y-3">
                {ownership.map((o, index) => (
                  <div key={index} className="border-2 border-black bg-white p-3 md:p-4 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] flex justify-between items-center gap-3 flex-wrap">
                    <div>
                      <div className="font-['Space_Mono',monospace] font-bold text-sm">{o.name}</div>
                      <div className="font-['Space_Mono',monospace] text-xs opacity-70">{o.note}</div>
                    </div>
                    <div className="border-2 border-black bg-[#FFFF88] px-3 py-1 text-xs">
                      <span className="font-['Space_Mono',monospace] font-bold">{o.stake}</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Valuation Dataset */}
            <div className="border-2 border-black bg-white shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
              <div className="border-b-2 border-black bg-black text-white px-4 md:px-6 py-3">
                <h2 className="font-['Space_Mono',monospace] font-bold text-sm md:text-base">
                  [ 03 ] VALUATION_DATASET
                </h2>
              </div>
              <div className="p-4 md:p-6">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {valuationRows.map((v, index) => (
                    <div key={index} className="border-2 border-black bg-white p-3 md:p-4 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">
                      <div className="font-['Space_Mono',monospace] text-xs opacity-70 mb-1">{v.label}</div>
                      <div className="font-['Space_Mono',monospace] font-bold text-lg">{v.value}</div>
                      <div className="font-['Space_Mono',monospace] text-xs opacity-60 mt-1">{v.detail}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* Track Record */}
            <div className="border-2 border-black bg-white shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
              <div className="border-b-2 border-black bg-black text-white px-4 md:px-6 py-3">
                <h2 className="font-['Space_Mono',monospace] font-bold text-sm md:text-base">
                  [ 04 ] ON_FIELD_TRACK_RECORD <span className="opacity-60 font-normal">// ESPN, 25 seasons tracked</span>
                </h2>
              </div>
              <div className="p-4 md:p-6 overflow-x-auto">
                <table className="w-full text-xs font-['Space_Mono',monospace] min-w-[500px]">
                  <thead>
                    <tr className="border-b-2 border-black">
                      <th className="text-left py-2 opacity-60">SEASON</th>
                      <th className="text-left py-2 opacity-60">TIER</th>
                      <th className="text-left py-2 opacity-60">POS</th>
                      <th className="text-left py-2 opacity-60">PTS</th>
                      <th className="text-left py-2 opacity-60">W</th>
                      <th className="text-left py-2 opacity-60">D</th>
                      <th className="text-left py-2 opacity-60">L</th>
                      <th className="text-left py-2 opacity-60">GD</th>
                    </tr>
                  </thead>
                  <tbody>
                    {trackRecord.map((r, index) => (
                      <tr key={index} className="border-b border-gray-200">
                        <td className="py-2 font-bold">{r.season}</td>
                        <td className="py-2">{r.tier}</td>
                        <td className="py-2">{r.pos}</td>
                        <td className="py-2">{r.pts}</td>
                        <td className="py-2">{r.w}</td>
                        <td className="py-2">{r.d}</td>
                        <td className="py-2">{r.l}</td>
                        <td className="py-2">{r.gd}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                <div className="font-['Space_Mono',monospace] text-xs opacity-70 mt-3 leading-relaxed">
                  Matrix score <strong>4.71/10</strong> composite (consistency 1.78, longevity 2.0, peak 0, recent-form 0.93). 15 of 25 tracked seasons in the top flight, zero relegations to League One, zero domestic titles pre-2025, zero Champions League appearances. 2025-26 points (45) down from 53 the year before - mild drift, not collapse, but worth watching against any premium price tag.
                </div>
              </div>
            </div>

            {/* Bid Critique - THE ASK */}
            <div className="border-2 border-black bg-white shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
              <div className="border-b-2 border-black bg-[#FFFF88] px-4 md:px-6 py-3">
                <h2 className="font-['Space_Mono',monospace] font-bold text-sm md:text-base">
                  [ 05 ] BID_STRESS_TEST: ₹6,500_CR_PROPOSAL
                </h2>
              </div>
              <div className="p-4 md:p-6 space-y-4">
                <div className="font-['Space_Mono',monospace] text-xs md:text-sm leading-relaxed opacity-80">
                  ₹6,500 Cr (₹65,000,000,000) at spot INR/GBP converts to <strong>~£505M</strong>. Stress-tested against the only real market data point Palace has produced - the Johnson/Textor stake transfer - and against Forbes' brand-value ceiling.
                </div>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {bidMultiples.map((b, index) => (
                    <div key={index} className="border-2 border-black bg-white p-3 md:p-4 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">
                      <div className="font-['Space_Mono',monospace] text-xs opacity-70 mb-1">{b.label}</div>
                      <div className="font-['Space_Mono',monospace] font-bold text-lg">{b.value}</div>
                      <div className="font-['Space_Mono',monospace] text-xs opacity-60 mt-1">{b.detail}</div>
                    </div>
                  ))}
                </div>
                <div className="font-['Space_Mono',monospace] text-xs bg-gray-50 p-3 border-l-4 border-black leading-relaxed">
                  <strong>CRITIQUE:</strong> ₹6,500 Cr / £505M pays a 26% premium over the last arm's-length price (£400M, Jul 2025) for an asset with no willing seller and no control on offer. Ask/Squad lands at 1.06x - inside the "healthy" 0.9-1.2x band on paper, but that band prices a normal transaction, not an unsolicited premium bid into a locked cap table. P/S of 2.29x sits below Forbes' implied 2.71x, meaning the bid is generous by transaction standards but still a "discount" only against a valuation model nobody has actually paid. Paying above the last real trade, for a passive stake, into a club whose points total just fell 53→45 and whose European prize pool just got demoted to Conference League tier, has no natural buyer logic behind it - the premium exists only because the bid, not the market, invented it.
                </div>
                <div className="font-['Space_Mono',monospace] text-xs bg-black text-white p-3 border-l-4 border-[#FFFF88] leading-relaxed">
                  <strong>VERDICT:</strong> REJECT at ₹6,500 Cr. If capital must land on Palace, anchor any offer to the £400M transaction basis (~₹5,150 Cr), not above it, and only as a passive minority stake if Harris, Blitzer, or Parish ever trim further. Otherwise redeploy toward the EFL-tier distressed and asymmetric plays already flagged in the wider dataset.
                </div>
              </div>
            </div>

            {/* Risk Log */}
            <div className="border-2 border-black bg-white shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
              <div className="border-b-2 border-black bg-black text-white px-4 md:px-6 py-3">
                <h2 className="font-['Space_Mono',monospace] font-bold text-sm md:text-base">
                  [ 06 ] RISK_LOG
                </h2>
              </div>
              <div className="p-4 md:p-6 space-y-2">
                {riskLog.map((r, index) => (
                  <div key={index} className="border-2 border-black bg-white p-3 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)] flex gap-3 flex-wrap items-start">
                    <div className={
                      "border-2 border-black px-2 py-1 text-xs font-bold shrink-0 " +
                      (r.sev === "HIGH" ? "bg-black text-white" : r.sev === "MED" ? "bg-[#FFFF88]" : "bg-white")
                    }>
                      {r.sev}
                    </div>
                    <div className="flex-1">
                      <div className="font-['Space_Mono',monospace] font-bold text-xs md:text-sm mb-1">{r.title}</div>
                      <div className="font-['Space_Mono',monospace] text-xs opacity-70">{r.detail}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Sources */}
            <div className="border-2 border-black bg-white shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] p-4 md:p-6">
              <div className="font-['Space_Mono',monospace] text-xs opacity-60 leading-relaxed">
                Data Sources: ESPN (live team-history pull, this desk's tool), Transfermarkt (squad values), Forbes Soccer Team Valuations (May 2025), BBC Sport (Johnson/Textor transaction reporting), We Are Palace (ownership register). FX: spot INR/GBP, July 2026.
              </div>
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CrystalPalaceFeasibility />);
  </script>
</body>
</html>
